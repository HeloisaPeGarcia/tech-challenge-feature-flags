name: Terraform Infrastructure IaC

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação do Terraform a ser executada'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      use_aws_academy:
        description: 'Usar ambiente AWS Academy (LabRole)?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: 'Terraform IaC'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inicializar Terraform (init)
        run: terraform init

      - name: Validar Configuração (validate)
        run: terraform validate

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        run: |
          terraform plan -var="use_aws_academy=${{ github.event.inputs.use_aws_academy }}"

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: |
          terraform apply -auto-approve -var="use_aws_academy=${{ github.event.inputs.use_aws_academy }}"

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve -var="use_aws_academy=${{ github.event.inputs.use_aws_academy }}"
